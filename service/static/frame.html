<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afterimage verification</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/frame.css"><script src="/assets/frame.js" defer></script></head><body><section class="panel"><div class="panel-heading"><span>◌ afterimage</span><span id="play-state" class="live">READY</span></div><div class="canvas-wrap"><canvas id="motion" width="384" height="240" aria-label="Moving dots containing a hidden four-letter word"></canvas><div id="loading">Preparing challenge…</div></div><div class="playback"><button id="toggle" class="text-button" disabled>Pause motion</button><span id="time-left"></span></div><h2><label for="answer">Which word can you read?</label></h2><input id="answer" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="Type the hidden word" disabled><div class="actions"><button id="verify" class="primary" disabled>Verify</button><button id="refresh" class="secondary">New challenge</button></div><p id="status" role="status" aria-live="polite"></p><p class="beta">Private beta · visual motion required</p></section></body></html>
